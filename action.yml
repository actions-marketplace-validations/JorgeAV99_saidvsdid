name: saidvsdid
description: 'What your coding agent did with the tests, in one PR comment: deleted, skipped or weakened tests.'
branding:
  icon: check-square
  color: orange

# The workflow gives the job its permissions (an action cannot): `pull-requests: write` to post the comment and
# `contents: read` to check out the code. The only token used is the job's own GITHUB_TOKEN (`github-token`'s default).
# The checkout needs the whole history (`fetch-depth: 0`): the diff runs from where the pull request left its base
# branch to its head.
#
# A JavaScript action: GitHub runs dist/action/index.js with its own Node.js 24. That file is one bundle with
# everything the check needs next to it in dist/action/ (the tree-sitter grammars, the Python scope reader), built by
# scripts/build-action.mjs and versioned: nothing is installed, downloaded or compiled in the user's repository.
# Python is the runner's own (`python3`, else `python`; GitHub's hosted runners have it): without one that reads the
# files, each Python test file is a WARN and nothing in it is a FAIL, never a silent OK.
inputs:
  fail-on:
    description: "`none` (default): the check stays green whatever the verdict. `fail`: it fails on FAIL or worse (UNVERIFIABLE, ERROR). `warn`: it fails on WARN or worse."
    required: false
    default: none
  exclude:
    description: Paths to leave out of the analysis, one glob per line (for example test data that holds deliberately broken tests).
    required: false
    default: ''
  comment:
    description: "`true` (default): post one comment on the pull request and update it on every run. `false`: the job summary only."
    required: false
    default: 'true'
  github-token:
    description: "The token that posts the comment. The default, the job's own GITHUB_TOKEN, is the one to use; the workflow gives it `pull-requests: write`."
    required: false
    default: ${{ github.token }}

outputs:
  verdict:
    description: OK, WARN, FAIL, UNVERIFIABLE or ERROR.
  exit-code:
    description: The CLI's exit code for that verdict (0 OK, 1 WARN, 2 FAIL, 3 UNVERIFIABLE or ERROR).
  comment-url:
    description: The PR comment's URL, empty when none was posted.

runs:
  using: node24
  main: dist/action/index.js
