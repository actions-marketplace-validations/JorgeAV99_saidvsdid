name: CI

# The fast tier: every push to a pull request, Linux only. The pre-merge tier is .github/workflows/full-ci.yml; the
# monthly one, .github/workflows/monthly.yml. The `main` ruleset requires both checks, so neither filters paths: a
# required check must exist for every pull request. No CI runs on a push to main: what a pull request brings into main
# passed both on exactly that tree (CLAUDE.md), and the ruleset lets nothing else reach main.
#
# One job, so the runner's two CPUs are shared rather than billed twice: the fixtures against the real runners run in
# the background while the test suite runs, and each step's result is checked (a failure in one does not hide another).

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  push:
    name: test, fixtures vs. real runners, Python 3.11/3.15, dogfood (ubuntu, node 22)
    runs-on: ubuntu-latest
    # The dogfood step comments on the pull request.
    permissions:
      contents: read
      pull-requests: write
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      # The last version listed is `python`: the suite's interpreter (the TG007 --f2p fixtures run pytest too), and the
      # runner-evidence recorder's. It is the newest supported version, so that every fixture's syntax compiles (a
      # fixture with newer syntax carries `minPython`).
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: |
            3.11
            3.15
          cache: pip
          cache-dependency-path: .github/requirements-ci.txt
      - run: for v in 3.11 3.15; do "python$v" -m pip install -r .github/requirements-ci.txt; done
      - run: npm ci
      - run: npm run typecheck
      - name: Test suite, and the fixtures against the real runners alongside
        # Fixture expectations are backed by what the real runners do: re-run them and fail if the evidence recorded in
        # fixtures/cases/**/case.json is stale. Linux distinguishes case: the `caseInsensitiveFs` fixtures are checked
        # by full-ci.yml on Windows and macOS.
        run: |
          node scripts/runner-evidence.mjs --check > "$RUNNER_TEMP/runner-evidence.log" 2>&1 &
          evidence=$!
          set +e
          npm test
          suite=$?
          wait "$evidence"
          fixtures=$?
          echo "::group::fixtures vs. real runners (exit $fixtures)"
          cat "$RUNNER_TEMP/runner-evidence.log"
          echo "::endgroup::"
          grep -E '^(MISMATCH|UNRECORDABLE)' -A2 "$RUNNER_TEMP/runner-evidence.log" || true
          echo "test suite: exit $suite; fixtures vs. real runners: exit $fixtures"
          test "$suite" -eq 0 && test "$fixtures" -eq 0
      # The Python scope reader (python/saidvsdid_scopes.py) on the oldest and the newest supported versions (python.org's
      # supported CPython versions; docs/rules.md, *Python*): the resolver's tests and every fixture with a Python file
      # (those that need newer syntax — PEP 695, t-strings — stand down below their `minPython`). full-ci.yml runs every
      # supported version.
      - name: Python 3.11 scope reader
        if: success() || failure()
        env:
          SAIDVSDID_PYTHON: python3.11
          SAIDVSDID_PYTHON_MATRIX: '3.11'
          SAIDVSDID_FIXTURES: python
        run: npx vitest run test/py-exhaustive.test.ts test/py-protocol.test.ts test/py-unavailable.test.ts test/positions.test.ts test/runner-binding.test.ts test/parse.test.ts test/fixtures.test.ts
      - name: Python 3.15 scope reader
        if: success() || failure()
        env:
          SAIDVSDID_PYTHON: python3.15
          SAIDVSDID_PYTHON_MATRIX: '3.15'
          SAIDVSDID_FIXTURES: python
        run: npx vitest run test/py-exhaustive.test.ts test/py-protocol.test.ts test/py-unavailable.test.ts test/positions.test.ts test/runner-binding.test.ts test/parse.test.ts test/fixtures.test.ts
      - run: npm run build
        if: success() || failure()
      - name: Smoke test the packed CLI
        if: success() || failure()
        shell: bash
        run: |
          npm pack --silent
          mkdir -p "$RUNNER_TEMP/smoke" && cd "$RUNNER_TEMP/smoke"
          npm init -y > /dev/null
          npm install --silent "$GITHUB_WORKSPACE"/saidvsdid-*.tgz
          npx saidvsdid --version
          npx saidvsdid explain TG001 > /dev/null
      # saidvsdid on this PR (dogfood), through this repository's own Action (action.yml): one PR comment, updated on
      # every push, and the job summary. fixtures/** holds deliberately tampered tests; they are data, not our suite.
      # FAIL, UNVERIFIABLE and ERROR block (`fail-on: fail`); WARN is for a human, reviewed on the PR. The README's
      # workflow example is this step with the Action's published name and its default, which blocks nothing
      # (test/readme-ci.test.ts). A pull request from a fork gets a read-only token: no comment, the summary only.
      # examples/** is the demo that the example pull request weakens (.github/workflows/example.yml, which comments
      # there instead of this step: one comment per pull request).
      - name: Check this PR
        if: github.event_name == 'pull_request' && github.head_ref != 'example/weakened-tests' && (success() || failure())
        uses: ./
        with:
          fail-on: fail
          exclude: |
            fixtures/**
            examples/**
