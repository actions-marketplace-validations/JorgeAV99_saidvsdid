name: monthly

# Once a month on main (the first Sunday), only if main changed since the last monthly run that ran, and by hand
# (workflow_dispatch: before publishing a version, for example; a run by hand always runs). Its purpose is to catch
# changes of the environment, not of the code: every commit that enters main through a pull request passed full-ci on
# exactly the tree that lands (CLAUDE.md: the PR is up to date with main, so its squash is the tree full-ci tested), so
# this run repeats only what depends on the platform, where a new runner image, Node, Python, git or shell can change a
# result:
# - full-ci.yml with `monthly: true`: macOS and Windows (each: the whole suite, every fixture against the real runners,
#   the packed CLI), Node 20 and 24, Python 3.11–3.15: everything the platforms ran on every push before the tiers; not
#   the guarantee matrix, which is deterministic on the code and passed
#   in full-ci before the merge;
# - test/e2e-real.test.ts in long mode on the three systems with a new seed: random sessions run for real in each
#   system's shells and judged by TG006 against reality. The seed is printed in the log and the job summary; rerun one
#   with workflow_dispatch and that seed.
# No CI runs on a push to main (CLAUDE.md). A change of documentation alone (docs/**, *.md at the root, LICENSE,
# .github/ISSUE_TEMPLATE/**: scripts/guarantee-matrix-paths.mjs --docs) does not count; in doubt, it runs.

on:
  # Cron cannot say "the first Sunday" (a day of the month and a day of the week combine with OR): every Sunday, and
  # the gate below lets only days 1–7 through.
  schedule:
    - cron: '17 3 * * 0'
  workflow_dispatch:
    inputs:
      seed:
        description: 'e2e seed (empty: a new one)'
        required: false
      sessions:
        description: 'e2e sessions per toy × agent × shell (8 combinations)'
        required: false
        default: '12'

permissions:
  contents: read
  actions: read

concurrency:
  group: monthly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: monthly (is it due, and has main changed?)
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.changes.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - id: changes
        name: Due, and commits since the last monthly run that ran
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; echo "run by hand"; exit 0; fi
          day=$((10#$(date -u +%d)))
          if [ "$day" -gt 7 ]; then echo "run=false" >> "$GITHUB_OUTPUT"; echo "not the first Sunday of the month (day $day)"; exit 0; fi
          # The last monthly run of this branch that ran: one where a job other than this gate reached a result. A run
          # this gate stopped (another Sunday, no change) ran nothing and does not count. Anything uncertain runs.
          last=""
          runs=$(gh api "repos/${{ github.repository }}/actions/workflows/monthly.yml/runs?branch=${{ github.ref_name }}&status=completed&per_page=50" \
            --jq '.workflow_runs[] | select(.id != ${{ github.run_id }}) | "\(.id) \(.head_sha)"') || runs=""
          while read -r id sha; do
            [ -n "$id" ] || continue
            ran=$(gh api "repos/${{ github.repository }}/actions/runs/$id/jobs?per_page=100" \
              --jq '[.jobs[] | select(.name | startswith("monthly (") | not) | select(.conclusion == "success" or .conclusion == "failure")] | length') || break
            if [ "$ran" -gt 0 ]; then last="$sha"; break; fi
          done <<< "$runs"
          echo "last monthly run that ran: '${last}'; now: ${{ github.sha }}"
          if [ -z "$last" ] || ! git cat-file -e "${last}^{commit}" 2>/dev/null; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ "$last" = "${{ github.sha }}" ]; then echo "run=false" >> "$GITHUB_OUTPUT"; echo "no commit since the last monthly run"; exit 0; fi
          node scripts/guarantee-matrix-paths.mjs --docs "$last" "${{ github.sha }}" || echo "run=true" >> "$GITHUB_OUTPUT"
          grep -q '^run=' "$GITHUB_OUTPUT" || echo "run=true" >> "$GITHUB_OUTPUT"

  platform:
    needs: changes
    if: needs.changes.outputs.run != 'false'
    uses: ./.github/workflows/full-ci.yml
    with:
      monthly: true

  e2e:
    name: e2e long (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.run != 'false'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15'
          cache: pip
          cache-dependency-path: .github/requirements-ci.txt
      - run: python -m pip install -r .github/requirements-ci.txt
      - run: npm ci
      - name: Seed
        id: seed
        shell: bash
        run: |
          seed="${{ inputs.seed }}"
          if [ -z "$seed" ]; then seed=$(( (${{ github.run_id }} * 31 + ${{ github.run_attempt }}) % 2147483647 )); fi
          echo "seed=$seed" >> "$GITHUB_OUTPUT"
          echo "e2e seed: $seed"
          echo "e2e seed: \`$seed\` (${{ matrix.os }})" >> "$GITHUB_STEP_SUMMARY"
      - name: Long mode
        shell: bash
        env:
          SAIDVSDID_E2E_SEED: ${{ steps.seed.outputs.seed }}
          SAIDVSDID_E2E_SESSIONS: ${{ inputs.sessions || '12' }}
          SAIDVSDID_E2E_LOG: ${{ runner.temp }}/e2e-sessions.log
        run: npx vitest run test/e2e-real.test.ts
      - name: Summary
        if: always()
        shell: bash
        run: |
          log="${{ runner.temp }}/e2e-sessions.log"
          test -f "$log" || exit 0
          tail -1 "$log"
          { echo '```'; tail -1 "$log"; echo "violations: $(grep -c VIOLATION "$log" || true)"; { grep VIOLATION "$log" || true; } | sed 's/.*VIOLATION//' | sort | uniq -c; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: e2e-sessions-${{ matrix.os }}
          path: ${{ runner.temp }}/e2e-sessions.log
          if-no-files-found: warn
