name: full-ci

# The pre-merge tier (CLAUDE.md, *Merge criterion*): no pull request is merged without the `full-ci` check green on its
# last commit, up to date with main (the `main` ruleset requires it; `node scripts/full-ci-status.mjs <PR>` also checks
# that the run covered the diff against main as it is now). It runs on every pull request, on every push to it.
# monthly.yml calls it on main (`monthly: true`).
#
# - The platform jobs: macOS, only what depends on macOS (the `caseInsensitiveFs` fixtures, the Python scope reader,
#   the real file system and shells; monthly: the whole suite, every fixture against the real runners, the packed CLI); Windows, the test files that depend on Windows (the list below; monthly: the whole
#   suite) and every fixture against the real runners; Node 20 and 24; the Python scope reader on every supported
#   version (3.11–3.15). The interpreter of every other job is the newest supported one, 3.15 (ci.yml says why).
# - The guarantee matrix (8 shards, failing closed), only when the pull request may change what it reads; never monthly.
# - No `paths-ignore` here: the check must exist for every pull request. The paths job (scripts/guarantee-matrix-paths.mjs,
#   fails closed: an unknown path runs everything) decides three times. `platform`: a pull request that only touches
#   docs/**, *.md at the root, LICENSE or .github/ISSUE_TEMPLATE/** gets the Linux test suite instead of the platform
#   jobs. `matrix`: the matrix is skipped only when every changed path is one it never reads (its EXCLUDED list:
#   docs, *.md, LICENSE, bench/**, fixtures/**, scripts/runner-evidence*, scripts/recorder-*, .github/** but this file,
#   test/** but test/guarantee-matrix.ts). `evidence`: Windows' fixtures against the real runners are skipped only when
#   every changed path is one the recorder never reads (RUNNER_EVIDENCE: the analyser, the suite, docs, bench); Linux
#   checks them on every push (ci.yml), and the monthly run on Windows and macOS.
# - Every checkout pins the pull request's head commit (`github.event.pull_request.head.sha`), not the temporary merge a
#   pull_request event checks out by default: the run tests the head's tree, which is the squash's once the PR is up
#   to date with its base (scripts/full-ci-status.mjs requires it), whatever the base was when it ran.
# - `full-ci` is the check to read, and the one the ruleset requires.

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_call:
    inputs:
      monthly:
        description: 'The monthly run: the platform jobs with the whole suite on Windows, no guarantee matrix'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # A literal prefix (called from monthly.yml, `github.workflow` is the caller's).
  group: full-ci-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  paths:
    name: full-ci (paths)
    runs-on: ubuntu-latest
    outputs:
      platform: ${{ steps.platform.outputs.run }}
      matrix: ${{ steps.matrix.outputs.run }}
      evidence: ${{ steps.evidence.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # Each step writes run=true|false; if the script cannot answer, run.
      - id: platform
        name: Does the change touch anything but documentation?
        shell: bash
        run: |
          # Outside a pull request (the monthly run): the platform jobs run.
          if [ "${{ github.event_name }}" != "pull_request" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          node scripts/guarantee-matrix-paths.mjs --docs "origin/${{ github.base_ref }}" HEAD || echo "run=true" >> "$GITHUB_OUTPUT"
          grep -q '^run=' "$GITHUB_OUTPUT" || echo "run=true" >> "$GITHUB_OUTPUT"
      - id: evidence
        name: Does the change touch what the fixtures against the real runners read?
        shell: bash
        run: |
          # Outside a pull request (the monthly run): they run.
          if [ "${{ github.event_name }}" != "pull_request" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          node scripts/guarantee-matrix-paths.mjs --runner-evidence "origin/${{ github.base_ref }}" HEAD || echo "run=true" >> "$GITHUB_OUTPUT"
          grep -q '^run=' "$GITHUB_OUTPUT" || echo "run=true" >> "$GITHUB_OUTPUT"
      - id: matrix
        name: Does the change touch what the guarantee matrix reads?
        shell: bash
        run: |
          # The monthly run never runs the matrix: it is deterministic on the code, which passed it in full-ci before
          # the merge. Any other run outside a pull request runs it.
          if [ "${{ inputs.monthly }}" = "true" ]; then echo "run=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ "${{ github.event_name }}" != "pull_request" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          node scripts/guarantee-matrix-paths.mjs "origin/${{ github.base_ref }}" HEAD || echo "run=true" >> "$GITHUB_OUTPUT"
          grep -q '^run=' "$GITHUB_OUTPUT" || echo "run=true" >> "$GITHUB_OUTPUT"

  check-dist:
    # dist/action/ is the GitHub Action's bundle (action.yml runs dist/action/index.js), versioned so that the Action
    # installs and compiles nothing in the user's repository. Rebuilt here from this commit's sources and lockfile
    # (scripts/build-action.mjs) and compared with the versioned copy, every file: what users run is what was reviewed.
    # On every pull request, whatever it touches.
    name: check-dist
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/build-action.mjs
      - name: The versioned dist/action/ is the build
        shell: bash
        run: |
          changed=$(git status --porcelain --untracked-files=all -- dist/action)
          if [ -n "$changed" ]; then
            echo "$changed"
            git diff --stat -- dist/action
            echo "::error::dist/action/ is not what scripts/build-action.mjs builds from this commit: run 'npm run build:action' and commit dist/action/"
            exit 1
          fi
          echo "dist/action/ is the build ($(git ls-files dist/action | wc -l) files)"

  docs-only:
    # Documentation only: the tests that read it (docs/rules.md, docs/evidence.md, the README, the privacy test…) are
    # in the Linux suite.
    name: test (docs only, ubuntu, node 22)
    needs: paths
    if: needs.paths.outputs.platform == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15'
          cache: pip
          cache-dependency-path: .github/requirements-ci.txt
      - run: python -m pip install -r .github/requirements-ci.txt
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  node:
    name: test (ubuntu, node ${{ matrix.node }})
    needs: paths
    if: needs.paths.outputs.platform != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        node: [20, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15'
          cache: pip
          cache-dependency-path: .github/requirements-ci.txt
      - run: python -m pip install -r .github/requirements-ci.txt
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Smoke test the packed CLI
        shell: bash
        run: |
          npm pack --silent
          mkdir -p "$RUNNER_TEMP/smoke" && cd "$RUNNER_TEMP/smoke"
          npm init -y > /dev/null
          npm install --silent "$GITHUB_WORKSPACE"/saidvsdid-*.tgz
          npx saidvsdid --version
          npx saidvsdid explain TG001 > /dev/null

  python-versions:
    # The Python scope reader on every supported version (python.org's supported CPython versions; ci.yml runs the
    # oldest and the newest on every push): the resolver's tests and every fixture with a Python file. One job, the
    # versions in turn: scripts/full-ci-status.mjs requires it by this name.
    name: Python 3.11–3.15 scope reader
    needs: paths
    if: needs.paths.outputs.platform != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: |
            3.11
            3.12
            3.13
            3.14
            3.15
          cache: pip
          cache-dependency-path: .github/requirements-ci.txt
      - run: for v in 3.11 3.12 3.13 3.14 3.15; do "python$v" -m pip install -r .github/requirements-ci.txt; done
      - run: npm ci
      - name: Python resolver tests and Python fixtures, on each version
        env:
          SAIDVSDID_FIXTURES: python
        run: |
          status=0
          for v in 3.11 3.12 3.13 3.14 3.15; do
            echo "::group::Python $v"
            SAIDVSDID_PYTHON="python$v" SAIDVSDID_PYTHON_MATRIX="$v" npx vitest run test/py-exhaustive.test.ts test/py-protocol.test.ts test/py-unavailable.test.ts test/positions.test.ts test/runner-binding.test.ts test/parse.test.ts test/fixtures.test.ts || { status=1; echo "::error::Python $v scope reader failed"; }
            echo "::endgroup::"
          done
          exit $status

  windows:
    # Windows starts processes about fifteen times slower than Linux (git 29–42 ms against 2.6), which is most of the
    # suite's time there. Before a merge, the files that depend on Windows (measured: the processes, links and
    # file-system writes each file causes, and the platform branches of src/ and of the tests):
    # - the real system: location-fs-real (the file system: case, trailing dots, device names, junctions, 750 cmd.exe
    #   writes), shell-cwd-real (Windows PowerShell, pwsh, Git Bash, npm.cmd), e2e-real (sessions run for real in bash
    #   and pwsh, with git and Python);
    # - the platform branches of src/: run.test (src/run.ts reads commands in cmd's dialect on Windows), and the
    #   fixtures checked with --f2p (src/f2p.ts names the interpreter and joins PYTHONPATH with `;`; their node_modules
    #   are junctions);
    # - the Python scope reader through its process (its stdio encoding failed on Windows alone once: positions.test):
    #   py-protocol, py-exhaustive (the `py` launcher), py-unavailable, positions, runner-binding, parse;
    # - git and child processes with Windows paths and links: cli (git, --f2p, a child's exit code), transcripts (git
    #   with `NUL` as its global config), record-session (440 links), guarantee-matrix-ci (git's paths, non-ASCII
    #   names), readme-ci and action (git on the fixture repositories, the Action's environment files);
    # - and the packed CLI through npm's .cmd shims.
    # Every other file is analysis with no process of its own, or reaches git and Python only through the paths above
    # (fixtures.test's other cases, baseline, invariant, silence-guarantee): the monthly run has the whole suite.
    name: test (windows, node 22, ${{ matrix.shard }})
    needs: paths
    if: needs.paths.outputs.platform != 'false'
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ inputs.monthly && fromJSON('["fixtures", "rest"]') || fromJSON('["windows-dependent files"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15'
          cache: pip
          cache-dependency-path: .github/requirements-ci.txt
      - run: python -m pip install -r .github/requirements-ci.txt
      - run: npm ci
      - name: The files that depend on Windows
        if: matrix.shard == 'windows-dependent files'
        env:
          SAIDVSDID_FIXTURES: f2p
        run: npx vitest run test/location-fs-real.test.ts test/shell-cwd-real.test.ts test/e2e-real.test.ts test/run.test.ts test/fixtures.test.ts test/py-protocol.test.ts test/py-exhaustive.test.ts test/py-unavailable.test.ts test/positions.test.ts test/runner-binding.test.ts test/parse.test.ts test/cli.test.ts test/transcripts.test.ts test/record-session.test.ts test/guarantee-matrix-ci.test.ts test/readme-ci.test.ts test/action.test.ts
      # Monthly: the whole suite, in two shards (test/fixtures.test.ts alone is ~45% of it).
      - name: test/fixtures.test.ts
        if: matrix.shard == 'fixtures'
        run: npx vitest run test/fixtures.test.ts
      # Every other test file, new ones included: the shard is defined by what it leaves out.
      - name: Every test file but test/fixtures.test.ts
        if: matrix.shard == 'rest'
        run: npx vitest run --exclude test/fixtures.test.ts
      - run: npm run typecheck
        if: matrix.shard != 'fixtures'
      - run: npm run build
        if: matrix.shard != 'fixtures'
      - name: Smoke test the packed CLI
        if: matrix.shard != 'fixtures'
        shell: bash
        run: |
          npm pack --silent
          mkdir -p "$RUNNER_TEMP/smoke" && cd "$RUNNER_TEMP/smoke"
          npm init -y > /dev/null
          npm install --silent "$GITHUB_WORKSPACE"/saidvsdid-*.tgz
          npx saidvsdid --version
          npx saidvsdid explain TG001 > /dev/null

  runner-evidence-windows:
    # Every fixture against the real runners on Windows (a case-insensitive file system: the `caseInsensitiveFs`
    # fixtures are checked here too).
    name: fixtures vs. real runners (windows)
    needs: paths
    if: needs.paths.outputs.platform != 'false' && needs.paths.outputs.evidence != 'false'
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15'
          cache: pip
          cache-dependency-path: .github/requirements-ci.txt
      - run: python -m pip install -r .github/requirements-ci.txt
      - run: npm ci
      - run: node scripts/runner-evidence.mjs --check

  macos:
    # macOS before a merge: only what depends on it. APFS does not distinguish case: the `caseInsensitiveFs` fixtures
    # against the real runners (the option fails if the file system distinguishes case); the Python scope reader
    # through its process protocol (it hung on the macOS runner: docs/backlog.md); and the tests whose oracle is the
    # real system: the file system (test/location-fs-real.test.ts) and the shells, macOS's bash and pwsh
    # (test/shell-cwd-real.test.ts). Monthly: everything macOS ran on every push before the tiers — the whole suite and
    # every fixture against the real runners (in parallel, as in ci.yml), typecheck, build and the packed CLI.
    name: ${{ inputs.monthly && 'macOS (whole suite, every fixture against the real runners, packed CLI)' || 'macOS (case-insensitive fixtures, Python scope reader, real file system and shells)' }}
    needs: paths
    if: needs.paths.outputs.platform != 'false'
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15'
          cache: pip
          cache-dependency-path: .github/requirements-ci.txt
      - run: python -m pip install -r .github/requirements-ci.txt
      - run: npm ci
      - name: The caseInsensitiveFs fixtures against the real runners
        if: ${{ !inputs.monthly }}
        run: node scripts/runner-evidence.mjs --check --case-insensitive-only
      - name: Python scope reader, real file system and shells
        if: ${{ !inputs.monthly && (success() || failure()) }}
        env:
          SAIDVSDID_PYTHON: python
        run: npx vitest run test/py-protocol.test.ts test/py-exhaustive.test.ts test/py-unavailable.test.ts test/location-fs-real.test.ts test/shell-cwd-real.test.ts
      - run: npm run typecheck
        if: ${{ inputs.monthly }}
      - name: Test suite, and every fixture against the real runners alongside
        if: ${{ inputs.monthly && (success() || failure()) }}
        run: |
          node scripts/runner-evidence.mjs --check > "$RUNNER_TEMP/runner-evidence.log" 2>&1 &
          evidence=$!
          set +e
          npm test
          suite=$?
          wait "$evidence"
          fixtures=$?
          echo "::group::fixtures vs. real runners (exit $fixtures)"
          cat "$RUNNER_TEMP/runner-evidence.log"
          echo "::endgroup::"
          grep -E '^(MISMATCH|UNRECORDABLE|skipped)' -A2 "$RUNNER_TEMP/runner-evidence.log" || true
          echo "test suite: exit $suite; fixtures vs. real runners: exit $fixtures"
          test "$suite" -eq 0 && test "$fixtures" -eq 0
      - run: npm run build
        if: ${{ inputs.monthly && (success() || failure()) }}
      - name: Smoke test the packed CLI
        if: ${{ inputs.monthly && (success() || failure()) }}
        shell: bash
        run: |
          npm pack --silent
          mkdir -p "$RUNNER_TEMP/smoke" && cd "$RUNNER_TEMP/smoke"
          npm init -y > /dev/null
          npm install --silent "$GITHUB_WORKSPACE"/saidvsdid-*.tgz
          npx saidvsdid --version
          npx saidvsdid explain TG001 > /dev/null

  guarantee-shard:
    # The best-effort detection's full cartesian matrix (test/guarantee-matrix.ts, generated from
    # src/parse/vocabulary.ts and src/rules/guarantee.ts): a regression test of what the contagion net reads today, not
    # a guarantee (docs/rules.md, *Best-effort detection*). Run whole through the pipeline in 8 shards by
    # scripts/guarantee-matrix.ts: no sampling. The test suite runs its slice (test/silence-guarantee.test.ts).
    name: guarantee matrix (shard ${{ matrix.shard }} of 8)
    needs: paths
    if: needs.paths.outputs.matrix != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15'
      - run: npm ci
      - name: Run the shard
        env:
          SAIDVSDID_PYTHON: python
        run: npx tsx scripts/guarantee-matrix.ts --mode full --shard ${{ matrix.shard }} --shards 8 --out failing.jsonl --report shard-${{ matrix.shard }}.json
      - name: Publish what the shard ran
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: guarantee-matrix-shard-${{ matrix.shard }}
          path: shard-${{ matrix.shard }}.json
          if-no-files-found: ignore
      - name: Publish what failed
        if: failure()
        run: head -n 200 failing.jsonl >> "$GITHUB_STEP_SUMMARY" || true

  guarantee-full:
    # Fails closed: every shard reports how many cases it ran; the check fails unless each of the 8 reported once, none
    # ran zero, none failed, and their cases add up to the total the generator counts without running anything.
    name: guarantee matrix (full)
    needs: [paths, guarantee-shard]
    if: always() && needs.paths.result == 'success' && needs.paths.outputs.matrix != 'false'
    runs-on: ubuntu-latest
    steps:
      - name: Every shard succeeded
        run: test "${{ needs.guarantee-shard.result }}" = "success"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: guarantee-matrix-shard-*
          path: shard-reports
          merge-multiple: true
      - name: The shards ran the whole matrix
        run: npx tsx scripts/guarantee-matrix.ts --verify shard-reports --shards 8 --mode full

  full-ci:
    # The one check to read before a merge, required by the `main` ruleset. Green only when the paths answered, and
    # every job those answers require succeeded; any other result fails it.
    name: full-ci
    needs: [paths, check-dist, docs-only, node, python-versions, windows, runner-evidence-windows, macos, guarantee-shard, guarantee-full]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every required job succeeded
        shell: bash
        env:
          PATHS: ${{ needs.paths.result }}
          PLATFORM: ${{ needs.paths.outputs.platform }}
          MATRIX: ${{ needs.paths.outputs.matrix }}
          EVIDENCE: ${{ needs.paths.outputs.evidence }}
          RESULTS: >-
            check-dist=${{ needs.check-dist.result }}
            docs-only=${{ needs.docs-only.result }}
            node=${{ needs.node.result }}
            python-versions=${{ needs.python-versions.result }}
            windows=${{ needs.windows.result }}
            runner-evidence-windows=${{ needs.runner-evidence-windows.result }}
            macos=${{ needs.macos.result }}
            guarantee-shard=${{ needs.guarantee-shard.result }}
            guarantee-full=${{ needs.guarantee-full.result }}
        run: |
          echo "paths: $PATHS (platform: '$PLATFORM', matrix: '$MATRIX', evidence: '$EVIDENCE'); $RESULTS"
          test "$PATHS" = "success"
          # platform=false (documentation only): docs-only must succeed; anything else, every platform job, and Windows'
          # fixtures against the real runners unless evidence=false. The matrix, unless matrix=false. An answer other
          # than an explicit "false" (empty included) requires the job. check-dist, always.
          if [ "$PLATFORM" = "false" ]; then required="check-dist docs-only"; else required="check-dist node python-versions windows macos"; fi
          if [ "$PLATFORM" != "false" ] && [ "$EVIDENCE" != "false" ]; then required="$required runner-evidence-windows"; fi
          if [ "$MATRIX" != "false" ]; then required="$required guarantee-shard guarantee-full"; fi
          for job in $required; do
            result=$(printf '%s\n' $RESULTS | sed -n "s/^$job=//p")
            echo "$job: $result"
            test "$result" = "success" || { echo "::error::$job: $result"; exit 1; }
          done
